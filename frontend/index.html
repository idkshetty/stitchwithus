<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#faf7f2">
  <meta name="description" content="You Can Stitch With Us — A community of artists and art enthusiasts. Hand embroidery courses, workshops, meetups, and 1:1 tailored sessions by Anupama.">
  <title>You Can Stitch With Us | Art Community</title>
  <link rel="icon" href="assets/images/logo-nav.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header-root"></div>
  <main id="main" tabindex="-1">
    <div class="boot-loader" role="status" aria-label="Loading You Can Stitch With Us">
      <div class="boot-hoop" aria-hidden="true"></div>
      <p>Threading the hoop…</p>
    </div>
  </main>
  <footer id="footer" class="site-footer"></footer>

  <div id="drawer-backdrop" class="backdrop" hidden></div>
  <aside id="bag-drawer" class="bag-drawer" aria-hidden="true" aria-labelledby="bag-title">
    <div class="bag-drawer-head">
      <div>
        <p class="eyebrow">Enrollment &amp; Booking Bag</p>
        <h2 id="bag-title">Your Stitch Bag</h2>
      </div>
      <button type="button" class="icon-btn" data-action="close-bag" aria-label="Close bag">✕</button>
    </div>
    <div id="bag-body" class="bag-drawer-body"></div>
    <div id="bag-foot" class="bag-drawer-foot" hidden></div>
  </aside>

  <dialog id="app-modal" class="app-modal" aria-modal="true"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
