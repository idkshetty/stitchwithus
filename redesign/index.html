<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8f9f7">
  <meta name="description" content="You Can Stitch With Us — Hand embroidery courses, workshops, community meetups, and 1:1 sessions hosted by Anupama.">
  <title>You Can Stitch With Us · Studio</title>
  <link rel="icon" href="assets/images/logo-nav.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Shrikhand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="scroll-progress" class="scroll-progress" aria-hidden="true"></div>
  <a class="skip-link" href="#main">Skip to content</a>

  <div id="site-header-root"></div>

  <main id="main" tabindex="-1">
    <div class="boot-loader" role="status" aria-label="Loading You Can Stitch With Us">
      <div class="boot-ring" aria-hidden="true"></div>
      <p>Threading your hoop…</p>
    </div>
  </main>

  <footer id="footer" class="site-footer"></footer>

  <div id="mobile-tabbar-root"></div>
  <div id="drawer-backdrop" class="backdrop" hidden></div>

  <aside id="bag-drawer" class="sheet-drawer" aria-hidden="true" aria-labelledby="bag-title">
    <div class="sheet-handle" aria-hidden="true"><span></span></div>
    <div class="sheet-head">
      <div>
        <p class="eyebrow">Enrollment &amp; Booking</p>
        <h2 id="bag-title">Your Stitch Bag</h2>
      </div>
      <button type="button" class="icon-close" data-action="close-drawers" aria-label="Close bag">✕</button>
    </div>
    <div id="bag-body" class="sheet-body"></div>
    <div id="bag-foot" class="sheet-foot" hidden></div>
  </aside>

  <aside id="mobile-more-sheet" class="sheet-drawer" aria-hidden="true" aria-labelledby="more-sheet-title">
    <div class="sheet-handle" aria-hidden="true"><span></span></div>
    <div class="sheet-head">
      <div>
        <p class="eyebrow">Navigation</p>
        <h2 id="more-sheet-title">More Pages</h2>
      </div>
      <button type="button" class="icon-close" data-action="close-drawers" aria-label="Close menu">✕</button>
    </div>
    <div id="more-sheet-body" class="sheet-body"></div>
  </aside>

  <dialog id="app-modal" class="app-modal" aria-modal="true"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
